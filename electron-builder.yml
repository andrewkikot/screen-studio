appId: com.andrew.screenshot-studio
productName: Screenshot Studio
directories:
  buildResources: build
publish:
  provider: github
  owner: andrewkikot
  repo: screen-studio
  releaseType: release
files:
  - out/**
extraResources:
  - from: resources
    to: .
    filter:
      - tray.png
      - tray-update.png
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
linux:
  category: Graphics
  target:
    - AppImage
    - deb
